<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>粒子解锁 - 3D Gesture Particle System</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  body{overflow:hidden;background:#0a0a0f;font-family:'Segoe UI',system-ui,-apple-system,sans-serif;color:#fff;-webkit-user-select:none;user-select:none}
  canvas#login-canvas{display:block;position:fixed;top:0;left:0;width:100%;height:100%;z-index:1}

  /* Login UI overlay */
  #login-overlay{position:fixed;inset:0;z-index:50;display:flex;flex-direction:column;align-items:center;justify-content:center;pointer-events:none;transition:opacity 0.8s}
  #login-overlay.fade-out{opacity:0}

  .login-title{font-size:28px;font-weight:700;letter-spacing:2px;margin-bottom:8px;text-shadow:0 0 30px rgba(120,90,255,0.5)}
  .login-subtitle{font-size:14px;color:rgba(255,255,255,0.5);margin-bottom:40px}

  /* Heart trail canvas */
  #trail-canvas{position:fixed;inset:0;z-index:40;pointer-events:none}

  /* Progress ring */
  #progress-ring{width:120px;height:120px;margin-bottom:30px;position:relative}
  #progress-ring svg{width:100%;height:100%;transform:rotate(-90deg)}
  #progress-ring circle{fill:none;stroke-width:4;stroke-linecap:round}
  #progress-bg{stroke:rgba(255,255,255,0.08)}
  #progress-fg{stroke:#ff4d6a;stroke-dasharray:339.292;stroke-dashoffset:339.292;transition:stroke-dashoffset 0.3s ease;filter:drop-shadow(0 0 6px rgba(255,77,106,0.5))}
  #progress-text{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:13px;color:rgba(255,255,255,0.6)}

  /* Instruction */
  .instruction{background:rgba(18,18,28,0.8);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);border:1px solid rgba(255,255,255,0.08);border-radius:16px;padding:16px 24px;font-size:13px;color:rgba(255,255,255,0.7);text-align:center;max-width:320px;line-height:1.6;pointer-events:auto}
  .instruction .icon{font-size:20px;display:block;margin-bottom:8px}
  .instruction .highlight{color:#ff4d6a;font-weight:600}

  /* Camera preview */
  #camera-container{position:fixed;bottom:20px;right:20px;width:180px;height:135px;border-radius:16px;overflow:hidden;z-index:60;border:2px solid rgba(255,255,255,0.15);box-shadow:0 8px 32px rgba(0,0,0,0.4);background:#000}
  #camera-container video{width:100%;height:100%;object-fit:cover;transform:scaleX(-1)}
  #camera-container canvas{position:absolute;top:0;left:0;width:100%;height:100%;transform:scaleX(-1)}
  #camera-label{position:absolute;top:8px;left:10px;font-size:10px;color:rgba(255,255,255,0.5);z-index:2;pointer-events:none}

  /* Start button */
  #start-btn{background:rgba(120,90,255,0.25);border:1.5px solid rgba(120,90,255,0.5);border-radius:14px;padding:14px 32px;color:#fff;font-size:14px;font-weight:600;cursor:pointer;pointer-events:auto;transition:all 0.3s;margin-top:20px;letter-spacing:1px}
  #start-btn:hover{background:rgba(120,90,255,0.4);border-color:rgba(120,90,255,0.8);box-shadow:0 0 24px rgba(120,90,255,0.3)}
  #start-btn.hidden{display:none}

  /* Skip button */
  #skip-btn{position:fixed;bottom:20px;left:20px;z-index:60;background:rgba(255,255,255,0.06);border:1px solid rgba(255,255,255,0.1);border-radius:10px;padding:8px 16px;color:rgba(255,255,255,0.4);font-size:11px;cursor:pointer;transition:all 0.3s;pointer-events:auto}
  #skip-btn:hover{color:rgba(255,255,255,0.7);border-color:rgba(255,255,255,0.2)}

  /* Success overlay */
  #success-overlay{position:fixed;inset:0;z-index:70;display:flex;flex-direction:column;align-items:center;justify-content:center;background:rgba(10,10,15,0.9);opacity:0;pointer-events:none;transition:opacity 0.5s}
  #success-overlay.show{opacity:1;pointer-events:auto}
  .success-icon{font-size:60px;margin-bottom:20px;animation:successPulse 1s ease infinite}
  .success-text{font-size:22px;font-weight:600;color:#ff4d6a;margin-bottom:10px}
  .success-sub{font-size:13px;color:rgba(255,255,255,0.5)}
  @keyframes successPulse{0%,100%{transform:scale(1)}50%{transform:scale(1.15)}}

  /* Detecting indicator */
  #detecting{position:fixed;top:50%;left:50%;transform:translate(-50%,-50%);z-index:55;font-size:16px;color:rgba(255,255,255,0.8);opacity:0;transition:opacity 0.3s;pointer-events:none;text-shadow:0 0 20px rgba(255,77,106,0.5)}
</style>
</head>
<body>

<canvas id="login-canvas"></canvas>
<canvas id="trail-canvas"></canvas>

<!-- Login Overlay -->
<div id="login-overlay">
  <div class="login-title">✦ 粒子空间</div>
  <div class="login-subtitle">Gesture Particle System</div>

  <div id="progress-ring">
    <svg viewBox="0 0 120 120">
      <circle id="progress-bg" cx="60" cy="60" r="54"/>
      <circle id="progress-fg" cx="60" cy="60" r="54"/>
    </svg>
    <div id="progress-text">0%</div>
  </div>

  <div class="instruction" id="instruction-box">
    <span class="icon">💕</span>
    用双手比一个 <span class="highlight">爱心</span> 来解锁进入<br>
    需要开启摄像头进行手势检测
  </div>

  <button id="start-btn">📷 开启摄像头</button>
</div>

<!-- Camera Preview -->
<div id="camera-container" style="display:none">
  <div id="camera-label">手势检测中</div>
  <video id="camera-video" autoplay playsinline></video>
  <canvas id="camera-overlay"></canvas>
</div>

<!-- Detecting text -->
<div id="detecting">请使用双手比心</div>

<!-- Success -->
<div id="success-overlay">
  <div class="success-icon">💖</div>
  <div class="success-text">解锁成功！</div>
  <div class="success-sub">正在进入粒子空间...</div>
</div>

<!-- Skip button -->
<button id="skip-btn">跳过 →</button>

<!-- Three.js -->
<script src="https://unpkg.com/three@0.160.0/build/three.min.js"></script>
<!-- MediaPipe -->
<script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands@0.4.1675469240/hands.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils@0.3.1675466862/camera_utils.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@mediapipe/drawing_utils@0.3.1675466124/drawing_utils.min.js"></script>

<script>
// ============================================================
//  Global State
// ============================================================
const LOGIN_STATE = {
  cameraActive: false,
  isTracking: false,
  progress: 0,
  points: [],
  heartTrailPoints: [],
  success: false,
  time: 0,
  transitionPhase: 'idle', // idle -> tracking -> converging -> success
};

// ============================================================
//  Three.js Setup
// ============================================================
const canvas = document.getElementById('login-canvas');
const renderer = new THREE.WebGLRenderer({ canvas, antialias: true, alpha: true });
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.setClearColor(0x0a0a0f, 1);

const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1000);
camera.position.set(0, 0, 30);

// ============================================================
//  Particle System
// ============================================================
const PARTICLE_COUNT = 8000;
let geometry, material, points3d;
let scatteredPositions, targetPositions, currentPositions;
let particleColors;

function generateScatteredPositions(count) {
  const positions = new Float32Array(count * 3);
  for (let i = 0; i < count; i++) {
    positions[i*3] = (Math.random() - 0.5) * 40;
    positions[i*3+1] = (Math.random() - 0.5) * 30;
    positions[i*3+2] = (Math.random() - 0.5) * 20;
  }
  return positions;
}

function generateHeartPositions(count) {
  const positions = new Float32Array(count * 3);
  for (let i = 0; i < count; i++) {
    const t = (i / count) * Math.PI * 2;
    const r = 0.8 + Math.random() * 0.4;
    const x = 16 * Math.pow(Math.sin(t), 3) * r;
    const y = (13 * Math.cos(t) - 5 * Math.cos(2*t) - 2 * Math.cos(3*t) - Math.cos(4*t)) * r;
    const z = (Math.random() - 0.5) * 4;
    positions[i*3] = x * 0.12;
    positions[i*3+1] = y * 0.12;
    positions[i*3+2] = z;
  }
  return positions;
}

function initParticles() {
  scatteredPositions = generateScatteredPositions(PARTICLE_COUNT);
  const heartPos = generateHeartPositions(PARTICLE_COUNT);
  targetPositions = heartPos;
  currentPositions = new Float32Array(scatteredPositions);

  geometry = new THREE.BufferGeometry();
  geometry.setAttribute('position', new THREE.BufferAttribute(new Float32Array(currentPositions), 3));

  particleColors = new Float32Array(PARTICLE_COUNT * 3);
  for (let i = 0; i < PARTICLE_COUNT; i++) {
    const brightness = 0.3 + Math.random() * 0.4;
    particleColors[i*3] = brightness * 0.6;
    particleColors[i*3+1] = brightness * 0.4;
    particleColors[i*3+2] = brightness;
  }
  geometry.setAttribute('color', new THREE.BufferAttribute(particleColors, 3));

  const sizes = new Float32Array(PARTICLE_COUNT);
  for (let i = 0; i < PARTICLE_COUNT; i++) {
    sizes[i] = 0.5 + Math.random() * 1.0;
  }
  geometry.setAttribute('aSize', new THREE.BufferAttribute(sizes, 1));

  material = new THREE.ShaderMaterial({
    uniforms: {
      uTime: { value: 0 },
      uBaseSize: { value: 1.8 * renderer.getPixelRatio() },
    },
    vertexShader: `
      attribute float aSize;
      varying vec3 vColor;
      varying float vAlpha;
      uniform float uTime;

      void main() {
        vColor = color;
        vec3 pos = position;
        pos.x += sin(uTime * 0.3 + position.y * 1.5) * 0.05;
        pos.y += cos(uTime * 0.4 + position.x * 1.5) * 0.05;

        vec4 mvPosition = modelViewMatrix * vec4(pos, 1.0);
        float dist = length(mvPosition.xyz);
        gl_PointSize = uBaseSize * aSize * (12.0 / max(dist, 1.0));
        gl_Position = projectionMatrix * mvPosition;
        vAlpha = smoothstep(60.0, 5.0, dist) * (0.6 + 0.4 * aSize);
      }
    `,
    fragmentShader: `
      varying vec3 vColor;
      varying float vAlpha;

      void main() {
        float d = length(gl_PointCoord - vec2(0.5));
        if (d > 0.5) discard;
        float alpha = smoothstep(0.5, 0.1, d) * vAlpha;
        gl_FragColor = vec4(vColor, alpha);
      }
    `,
    transparent: true,
    depthWrite: false,
    blending: THREE.AdditiveBlending,
    vertexColors: true,
  });

  points3d = new THREE.Points(geometry, material);
  scene.add(points3d);
}

initParticles();

// ============================================================
//  Heart Trail Canvas
// ============================================================
const trailCanvas = document.getElementById('trail-canvas');
const trailCtx = trailCanvas.getContext('2d');

function resizeTrailCanvas() {
  trailCanvas.width = window.innerWidth;
  trailCanvas.height = window.innerHeight;
}
resizeTrailCanvas();

function drawHeartTrail() {
  trailCtx.clearRect(0, 0, trailCanvas.width, trailCanvas.height);
  const pts = LOGIN_STATE.heartTrailPoints;
  if (pts.length < 2) return;

  trailCtx.beginPath();
  trailCtx.moveTo(pts[0].x, pts[0].y);
  for (let i = 1; i < pts.length; i++) {
    const alpha = 0.3 + (i / pts.length) * 0.7;
    trailCtx.strokeStyle = `rgba(255, 77, 106, ${alpha})`;
    trailCtx.lineWidth = 2 + (i / pts.length) * 3;
    trailCtx.shadowColor = 'rgba(255, 77, 106, 0.5)';
    trailCtx.shadowBlur = 10;
    trailCtx.lineTo(pts[i].x, pts[i].y);
    trailCtx.stroke();
    trailCtx.beginPath();
    trailCtx.moveTo(pts[i].x, pts[i].y);
  }
}

// ============================================================
//  Heart Shape Detection (双手比心手势)
// ============================================================

// ============================================================
//  MediaPipe Hands
// ============================================================
let hands = null;
let mpCamera = null;
const videoElement = document.getElementById('camera-video');
const overlayCanvas = document.getElementById('camera-overlay');
const overlayCtx = overlayCanvas.getContext('2d');

function initHands() {
  if (hands) return;
  hands = new Hands({
    locateFile: (file) => `https://cdn.jsdelivr.net/npm/@mediapipe/hands@0.4.1675469240/${file}`
  });
  hands.setOptions({
    maxNumHands: 2,
    modelComplexity: 1,
    minDetectionConfidence: 0.7,
    minTrackingConfidence: 0.5,
  });
  hands.onResults(onHandResults);
}


function onHandResults(results) {
  if (LOGIN_STATE.success) return;

  overlayCanvas.width = overlayCanvas.clientWidth;
  overlayCanvas.height = overlayCanvas.clientHeight;
  overlayCtx.clearRect(0, 0, overlayCanvas.width, overlayCanvas.height);

  // 检测双手比心手势
  if (results.multiHandLandmarks && results.multiHandLandmarks.length === 2) {
    const leftHand = results.multiHandLandmarks[0];
    const rightHand = results.multiHandLandmarks[1];

    // 绘制双手骨架
    drawConnectors(overlayCtx, leftHand, HAND_CONNECTIONS, { color: 'rgba(255,77,106,0.5)', lineWidth: 1.5 });
    drawLandmarks(overlayCtx, leftHand, { color: '#ff4d6a', lineWidth: 1, radius: 2 });
    drawConnectors(overlayCtx, rightHand, HAND_CONNECTIONS, { color: 'rgba(255,77,106,0.5)', lineWidth: 1.5 });
    drawLandmarks(overlayCtx, rightHand, { color: '#ff4d6a', lineWidth: 1, radius: 2 });

    // 检测双手比心手势
    const isHeartGesture = detectTwoHandHeartGesture(leftHand, rightHand);

    if (isHeartGesture) {
      document.getElementById('detecting').style.opacity = '1';
      document.getElementById('detecting').textContent = '💕 比心检测中...';

      // 计算心形中心点
      const leftIndexTip = leftHand[8];
      const rightIndexTip = rightHand[8];
      const centerX = ((1 - leftIndexTip.x) + (1 - rightIndexTip.x)) / 2 * window.innerWidth;
      const centerY = (leftIndexTip.y + rightIndexTip.y) / 2 * window.innerHeight;

      // 添加到轨迹点（用于视觉效果）
      LOGIN_STATE.heartTrailPoints.push({ x: centerX, y: centerY });

      // 限制轨迹点数量
      if (LOGIN_STATE.heartTrailPoints.length > 50) {
        LOGIN_STATE.heartTrailPoints.shift();
      }

      // 计算进度
      if (LOGIN_STATE.heartTrailPoints.length > 10) {
        // 双手比心进度直接增加
        LOGIN_STATE.progress = Math.min(LOGIN_STATE.progress + 0.03, 1.0);
        updateProgressRing();

        if (LOGIN_STATE.progress >= 1.0) {
          triggerSuccess();
        }
      }
    } else {
      document.getElementById('detecting').style.opacity = '0';
      // 重置进度和轨迹
      if (LOGIN_STATE.progress > 0) {
        LOGIN_STATE.progress = Math.max(0, LOGIN_STATE.progress - 0.01);
        updateProgressRing();
      }
      LOGIN_STATE.heartTrailPoints = [];
    }
  } else if (results.multiHandLandmarks && results.multiHandLandmarks.length === 1) {
    // 单手时显示提示
    document.getElementById('detecting').style.opacity = '1';
    document.getElementById('detecting').textContent = '请伸出另一只手比心';
  } else {
    document.getElementById('detecting').style.opacity = '0';
  }
}

// 检测双手比心手势
function detectTwoHandHeartGesture(leftHand, rightHand) {
  // 关键点索引
  const INDEX_TIP = 8;
  const INDEX_MCP = 5;
  const THUMB_TIP = 4;
  const THUMB_MCP = 2;
  const MIDDLE_TIP = 12;
  const MIDDLE_MCP = 9;
  const RING_TIP = 16;
  const RING_MCP = 13;
  const PINKY_TIP = 20;
  const PINKY_MCP = 17;

  // 检查左手手指状态
  const leftIndexExtended = leftHand[INDEX_TIP].y < leftHand[INDEX_MCP].y;
  const leftMiddleCurled = leftHand[MIDDLE_TIP].y > leftHand[MIDDLE_MCP].y;
  const leftRingCurled = leftHand[RING_TIP].y > leftHand[RING_MCP].y;
  const leftPinkyCurled = leftHand[PINKY_TIP].y > leftHand[PINKY_MCP].y;

  // 检查右手手指状态
  const rightIndexExtended = rightHand[INDEX_TIP].y < rightHand[INDEX_MCP].y;
  const rightMiddleCurled = rightHand[MIDDLE_TIP].y > rightHand[MIDDLE_MCP].y;
  const rightRingCurled = rightHand[RING_TIP].y > rightHand[RING_MCP].y;
  const rightPinkyCurled = rightHand[PINKY_TIP].y > rightHand[PINKY_MCP].y;

  // 检查双手食指是否在顶部接触
  const leftIndexTipScreen = {
    x: (1 - leftHand[INDEX_TIP].x) * window.innerWidth,
    y: leftHand[INDEX_TIP].y * window.innerHeight
  };
  const rightIndexTipScreen = {
    x: (1 - rightHand[INDEX_TIP].x) * window.innerWidth,
    y: rightHand[INDEX_TIP].y * window.innerHeight
  };

  const indexDistance = Math.sqrt(
    Math.pow(leftIndexTipScreen.x - rightIndexTipScreen.x, 2) +
    Math.pow(leftIndexTipScreen.y - rightIndexTipScreen.y, 2)
  );

  // 检查双手拇指是否在底部接触
  const leftThumbTipScreen = {
    x: (1 - leftHand[THUMB_TIP].x) * window.innerWidth,
    y: leftHand[THUMB_TIP].y * window.innerHeight
  };
  const rightThumbTipScreen = {
    x: (1 - rightHand[THUMB_TIP].x) * window.innerWidth,
    y: rightHand[THUMB_TIP].y * window.innerHeight
  };

  const thumbDistance = Math.sqrt(
    Math.pow(leftThumbTipScreen.x - rightThumbTipScreen.x, 2) +
    Math.pow(leftThumbTipScreen.y - rightThumbTipScreen.y, 2)
  );

  // 综合判断
  const fingersCorrect = leftIndexExtended && leftMiddleCurled && leftRingCurled && leftPinkyCurled &&
                         rightIndexExtended && rightMiddleCurled && rightRingCurled && rightPinkyCurled;

  const handsClose = indexDistance < 120 && thumbDistance < 120;

  // 检查食指是否在上方，拇指是否在下方
  const indexAboveThumb = leftIndexTipScreen.y < leftThumbTipScreen.y &&
                          rightIndexTipScreen.y < rightThumbTipScreen.y;

  return fingersCorrect && handsClose && indexAboveThumb;
}

function updateProgressRing() {
  const circumference = 339.292;
  const offset = circumference * (1 - LOGIN_STATE.progress);
  document.getElementById('progress-fg').style.strokeDashoffset = offset;
  document.getElementById('progress-text').textContent = Math.round(LOGIN_STATE.progress * 100) + '%';

  // Color transition based on progress
  const fg = document.getElementById('progress-fg');
  if (LOGIN_STATE.progress > 0.5) {
    fg.style.stroke = '#ff4d6a';
    fg.style.filter = `drop-shadow(0 0 ${10 * LOGIN_STATE.progress}px rgba(255,77,106,0.8))`;
  } else {
    fg.style.stroke = '#785aff';
    fg.style.filter = 'drop-shadow(0 0 6px rgba(120,90,255,0.5))';
  }
}

async function startCamera() {
  try {
    initHands();
    const stream = await navigator.mediaDevices.getUserMedia({
      video: { width: 640, height: 480, facingMode: 'user' }
    });
    videoElement.srcObject = stream;
    LOGIN_STATE.cameraActive = true;
    document.getElementById('camera-container').style.display = 'block';
    document.getElementById('start-btn').classList.add('hidden');
    document.getElementById('instruction-box').innerHTML =
      '<span class="icon">💕</span>用双手比一个<span class="highlight">爱心</span><br>保持手势，比心即解锁';

    mpCamera = new Camera(videoElement, {
      onFrame: async () => {
        await hands.send({ image: videoElement });
      },
      width: 640,
      height: 480,
    });
    mpCamera.start();
  } catch (err) {
    console.error('Camera error:', err);
    document.getElementById('instruction-box').innerHTML =
      '<span class="icon">⚠️</span>无法访问摄像头<br>请点击 <span class="highlight">跳过</span> 直接进入';
  }
}

// ============================================================
//  Success & Transition
// ============================================================
function triggerSuccess() {
  if (LOGIN_STATE.success) return;
  LOGIN_STATE.success = true;
  LOGIN_STATE.transitionPhase = 'converging';

  document.getElementById('detecting').style.opacity = '0';
  trailCtx.clearRect(0, 0, trailCanvas.width, trailCanvas.height);

  // Show success overlay
  setTimeout(() => {
    document.getElementById('success-overlay').classList.add('show');
  }, 1200);

  // Redirect after animation
  setTimeout(() => {
    window.location.href = 'main.html';
  }, 2800);
}

// ============================================================
//  UI Events
// ============================================================
document.getElementById('start-btn').addEventListener('click', startCamera);

document.getElementById('skip-btn').addEventListener('click', () => {
  window.location.href = 'main.html';
});

window.addEventListener('resize', () => {
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
  resizeTrailCanvas();
});

// ============================================================
//  Animation Loop
// ============================================================
function animate() {
  requestAnimationFrame(animate);
  LOGIN_STATE.time += 0.016;

  if (material) {
    material.uniforms.uTime.value = LOGIN_STATE.time;
  }

  if (geometry) {
    const posAttr = geometry.getAttribute('position');

    if (LOGIN_STATE.transitionPhase === 'converging') {
      // Converge particles to heart shape with easing
      for (let i = 0; i < PARTICLE_COUNT; i++) {
        const idx = i * 3;
        posAttr.array[idx] += (targetPositions[idx] - posAttr.array[idx]) * 0.04;
        posAttr.array[idx+1] += (targetPositions[idx+1] - posAttr.array[idx+1]) * 0.04;
        posAttr.array[idx+2] += (targetPositions[idx+2] - posAttr.array[idx+2]) * 0.04;

        // Transition colors to red/pink
        particleColors[idx] += (0.9 + Math.random()*0.1 - particleColors[idx]) * 0.03;
        particleColors[idx+1] += (0.2 + Math.random()*0.15 - particleColors[idx+1]) * 0.03;
        particleColors[idx+2] += (0.3 + Math.random()*0.15 - particleColors[idx+2]) * 0.03;
      }
    } else if (LOGIN_STATE.transitionPhase !== 'success') {
      // Scattered floating animation
      for (let i = 0; i < PARTICLE_COUNT; i++) {
        const idx = i * 3;
        posAttr.array[idx] = scatteredPositions[idx] + Math.sin(LOGIN_STATE.time * 0.2 + i * 0.01) * 0.5;
        posAttr.array[idx+1] = scatteredPositions[idx+1] + Math.cos(LOGIN_STATE.time * 0.3 + i * 0.01) * 0.5;
      }

      // Progress-based color shift
      if (LOGIN_STATE.progress > 0) {
        for (let i = 0; i < PARTICLE_COUNT; i++) {
          const idx = i * 3;
          const targetR = 0.5 + LOGIN_STATE.progress * 0.5;
          const targetG = 0.3 * (1 - LOGIN_STATE.progress);
          const targetB = 0.6 * (1 - LOGIN_STATE.progress);
          particleColors[idx] += (targetR - particleColors[idx]) * 0.02;
          particleColors[idx+1] += (targetG - particleColors[idx+1]) * 0.02;
          particleColors[idx+2] += (targetB - particleColors[idx+2]) * 0.02;
        }
      }
    }

    posAttr.needsUpdate = true;
    geometry.getAttribute('color').needsUpdate = true;
  }

  // Slow rotation
  if (points3d) {
    points3d.rotation.y = Math.sin(LOGIN_STATE.time * 0.1) * 0.15;
    points3d.rotation.x = Math.cos(LOGIN_STATE.time * 0.08) * 0.1;
  }

  drawHeartTrail();
  renderer.render(scene, camera);
}

// ============================================================
//  Init
// ============================================================
animate();
</script>
</body>
</html>
