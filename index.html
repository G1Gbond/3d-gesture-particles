<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>3D Gesture Particle System</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  body{overflow:hidden;background:#0a0a0f;font-family:'Segoe UI',system-ui,-apple-system,sans-serif;color:#fff}
  canvas#three-canvas{display:block;position:fixed;top:0;left:0;width:100%;height:100%;z-index:1}

  /* Camera preview */
  #camera-container{position:fixed;bottom:20px;right:20px;width:200px;height:150px;border-radius:16px;overflow:hidden;z-index:100;border:2px solid rgba(255,255,255,0.15);box-shadow:0 8px 32px rgba(0,0,0,0.4);background:#000}
  #camera-container video{width:100%;height:100%;object-fit:cover;transform:scaleX(-1)}
  #camera-container canvas{position:absolute;top:0;left:0;width:100%;height:100%;transform:scaleX(-1)}
  #camera-label{position:absolute;top:8px;left:10px;font-size:11px;color:rgba(255,255,255,0.6);z-index:2;pointer-events:none}
  #camera-off{display:flex;align-items:center;justify-content:center;width:100%;height:100%;font-size:13px;color:rgba(255,255,255,0.4)}

  /* Control panel */
  #panel{position:fixed;top:20px;left:20px;width:260px;z-index:100;background:rgba(18,18,28,0.75);backdrop-filter:blur(20px) saturate(1.5);-webkit-backdrop-filter:blur(20px) saturate(1.5);border:1px solid rgba(255,255,255,0.08);border-radius:20px;padding:24px;box-shadow:0 8px 40px rgba(0,0,0,0.3);transition:all 0.4s cubic-bezier(0.4,0,0.2,1);overflow:hidden}
  #panel.collapsed{width:260px;padding:16px 24px}
  #panel h2{font-size:15px;font-weight:600;margin-bottom:0;letter-spacing:0.5px;display:flex;align-items:center;gap:8px;cursor:pointer;user-select:none;transition:margin-bottom 0.4s cubic-bezier(0.4,0,0.2,1)}
  #panel:not(.collapsed) h2{margin-bottom:18px}
  #panel h2 span{font-size:18px}
  #panel-toggle{margin-left:auto;font-size:14px;transition:transform 0.4s cubic-bezier(0.4,0,0.2,1);color:rgba(255,255,255,0.5)}
  #panel.collapsed #panel-toggle{transform:rotate(-90deg)}
  #panel-body{max-height:600px;opacity:1;transition:max-height 0.4s cubic-bezier(0.4,0,0.2,1),opacity 0.3s ease}
  #panel.collapsed #panel-body{max-height:0;opacity:0;pointer-events:none}

  .section-label{font-size:11px;text-transform:uppercase;letter-spacing:1.5px;color:rgba(255,255,255,0.4);margin-bottom:10px;margin-top:18px}
  .section-label:first-of-type{margin-top:0}

  /* Model buttons */
  .model-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
  .model-btn{background:rgba(255,255,255,0.06);border:1.5px solid rgba(255,255,255,0.1);border-radius:12px;padding:12px 8px;cursor:pointer;text-align:center;transition:all 0.25s;color:#fff;font-size:12px;font-weight:500}
  .model-btn:hover{background:rgba(255,255,255,0.12);border-color:rgba(255,255,255,0.2)}
  .model-btn.active{background:rgba(120,90,255,0.25);border-color:rgba(120,90,255,0.6);box-shadow:0 0 20px rgba(120,90,255,0.15)}
  .model-btn .icon{font-size:24px;display:block;margin-bottom:4px}

  /* Color picker */
  .color-row{display:flex;align-items:center;gap:12px;margin-top:8px}
  .color-presets{display:flex;gap:6px;flex:1}
  .color-dot{width:28px;height:28px;border-radius:50%;cursor:pointer;border:2px solid transparent;transition:all 0.2s;position:relative}
  .color-dot:hover{transform:scale(1.15)}
  .color-dot.active{border-color:#fff;box-shadow:0 0 12px rgba(255,255,255,0.3)}
  #color-picker{width:28px;height:28px;border:none;border-radius:50%;cursor:pointer;background:none;padding:0;overflow:hidden}
  #color-picker::-webkit-color-swatch-wrapper{padding:0}
  #color-picker::-webkit-color-swatch{border:2px solid rgba(255,255,255,0.2);border-radius:50%}

  /* Sliders */
  .slider-group{margin-top:10px}
  .slider-label{display:flex;justify-content:space-between;font-size:11px;color:rgba(255,255,255,0.5);margin-bottom:6px}
  input[type=range]{-webkit-appearance:none;width:100%;height:4px;border-radius:2px;background:rgba(255,255,255,0.1);outline:none}
  input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:16px;height:16px;border-radius:50%;background:#785aff;cursor:pointer;box-shadow:0 0 8px rgba(120,90,255,0.4)}

  /* Gesture indicator */
  .gesture-status{margin-top:16px;padding:10px 12px;background:rgba(255,255,255,0.04);border-radius:10px;font-size:11px;color:rgba(255,255,255,0.5);display:flex;align-items:center;gap:8px}
  .gesture-dot{width:8px;height:8px;border-radius:50%;flex-shrink:0}
  .gesture-dot.active{background:#4ade80;box-shadow:0 0 8px rgba(74,222,128,0.5)}
  .gesture-dot.inactive{background:#f87171}
  .gesture-values{margin-top:6px;font-size:10px;color:rgba(255,255,255,0.35);font-family:monospace}

  /* Fullscreen button */
  #fullscreen-btn{position:fixed;top:20px;right:20px;width:44px;height:44px;border-radius:12px;background:rgba(18,18,28,0.75);backdrop-filter:blur(20px);border:1px solid rgba(255,255,255,0.08);cursor:pointer;z-index:100;display:flex;align-items:center;justify-content:center;transition:all 0.25s;color:rgba(255,255,255,0.6);font-size:18px}
  #fullscreen-btn:hover{background:rgba(30,30,50,0.85);color:#fff;border-color:rgba(255,255,255,0.2)}

  /* Camera toggle */
  #camera-toggle{position:fixed;bottom:20px;right:232px;width:44px;height:44px;border-radius:12px;background:rgba(18,18,28,0.75);backdrop-filter:blur(20px);border:1px solid rgba(255,255,255,0.08);cursor:pointer;z-index:100;display:flex;align-items:center;justify-content:center;transition:all 0.25s;color:rgba(255,255,255,0.6);font-size:16px}
  #camera-toggle:hover{background:rgba(30,30,50,0.85);color:#fff}
  #camera-toggle.active{border-color:rgba(74,222,128,0.5);color:#4ade80}

  /* Loading */
  #loading{position:fixed;inset:0;background:#0a0a0f;z-index:9999;display:flex;flex-direction:column;align-items:center;justify-content:center;transition:opacity 0.6s}
  #loading.hide{opacity:0;pointer-events:none}
  .loader{width:40px;height:40px;border:3px solid rgba(255,255,255,0.1);border-top-color:#785aff;border-radius:50%;animation:spin 0.8s linear infinite}
  @keyframes spin{to{transform:rotate(360deg)}}
  #loading p{margin-top:16px;font-size:13px;color:rgba(255,255,255,0.4)}
</style>
</head>
<body>

<div id="loading"><div class="loader"></div><p>加载粒子引擎...</p></div>

<canvas id="three-canvas"></canvas>

<!-- Control Panel -->
<div id="panel">
  <h2 id="panel-header"><span>✦</span> 粒子系统 <span id="panel-toggle">▼</span></h2>
  <div id="panel-body">
  <div class="section-label">粒子模型</div>
  <div class="model-grid">
    <button class="model-btn active" data-model="heart"><span class="icon">♥</span>爱心</button>
    <button class="model-btn" data-model="flower"><span class="icon">❀</span>花朵</button>
    <button class="model-btn" data-model="firework"><span class="icon">✧</span>烟花</button>
  </div>

  <div class="section-label">粒子颜色</div>
  <div class="color-row">
    <div class="color-presets">
      <div class="color-dot active" data-color="#ff4d6a" style="background:#ff4d6a"></div>
      <div class="color-dot" data-color="#785aff" style="background:#785aff"></div>
      <div class="color-dot" data-color="#4ade80" style="background:#4ade80"></div>
      <div class="color-dot" data-color="#fbbf24" style="background:#fbbf24"></div>
      <div class="color-dot" data-color="#38bdf8" style="background:#38bdf8"></div>
    </div>
    <input type="color" id="color-picker" value="#ff4d6a">
  </div>

  <div class="section-label">粒子参数</div>
  <div class="slider-group">
    <div class="slider-label"><span>粒子大小</span><span id="size-val">2.0</span></div>
    <input type="range" id="particle-size" min="0.5" max="5" step="0.1" value="2.0">
  </div>
  <div class="slider-group">
    <div class="slider-label"><span>粒子密度</span><span id="density-val">15000</span></div>
    <input type="range" id="particle-density" min="3000" max="30000" step="1000" value="15000">
  </div>
  <div class="slider-group">
    <div class="slider-label"><span>旋转速度</span><span id="rotate-val">0.3</span></div>
    <input type="range" id="rotate-speed" min="0" max="1" step="0.05" value="0.3">
  </div>

  <div class="gesture-status">
    <div class="gesture-dot inactive" id="gesture-dot"></div>
    <span id="gesture-text">手势检测未开启</span>
  </div>
  <div class="gesture-values" id="gesture-values"></div>
  </div>
</div>

<!-- Fullscreen Button -->
<button id="fullscreen-btn" title="全屏">⛶</button>

<!-- Camera Toggle -->
<button id="camera-toggle" title="开启摄像头">📷</button>

<!-- Camera Preview -->
<div id="camera-container" style="display:none">
  <div id="camera-label">手势检测</div>
  <video id="camera-video" autoplay playsinline></video>
  <canvas id="camera-overlay"></canvas>
</div>

<!-- Three.js -->
<script src="https://unpkg.com/three@0.160.0/build/three.min.js"></script>

<!-- MediaPipe Hands -->
<script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands@0.4.1675469240/hands.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils@0.3.1675466862/camera_utils.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@mediapipe/drawing_utils@0.3.1675466124/drawing_utils.min.js"></script>

<script>
// ============================================================
//  Global State
// ============================================================
const STATE = {
  model: 'heart',
  color: new THREE.Color('#ff4d6a'),
  particleSize: 2.0,
  particleCount: 15000,
  rotateSpeed: 0.3,
  scale: 1.0,
  diffusion: 0.0,
  targetScale: 1.0,
  targetDiffusion: 0.0,
  handDetected: false,
  cameraActive: false,
  time: 0,
};

// ============================================================
//  Three.js Setup
// ============================================================
const canvas = document.getElementById('three-canvas');
const renderer = new THREE.WebGLRenderer({ canvas, antialias: true, alpha: true });
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.setClearColor(0x0a0a0f, 1);

const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1000);
camera.position.set(0, 0, 28);

// ============================================================
//  Particle System
// ============================================================
let geometry, material, points;
let basePositions = [];
let targetPositions = [];

// Heart shape: parametric equation
function generateHeart(count) {
  const positions = new Float32Array(count * 3);
  const colors = new Float32Array(count * 3);
  for (let i = 0; i < count; i++) {
    const t = (i / count) * Math.PI * 2;
    // Add some randomness for thickness
    const r = 0.8 + Math.random() * 0.4;
    const x = 16 * Math.pow(Math.sin(t), 3) * r;
    const y = (13 * Math.cos(t) - 5 * Math.cos(2*t) - 2 * Math.cos(3*t) - Math.cos(4*t)) * r;
    const z = (Math.random() - 0.5) * 4;
    positions[i*3] = x * 0.15;
    positions[i*3+1] = y * 0.15 - 0.5;
    positions[i*3+2] = z;
    // Slight color variation
    const c = STATE.color;
    colors[i*3] = c.r + (Math.random()-0.5)*0.1;
    colors[i*3+1] = c.g + (Math.random()-0.5)*0.1;
    colors[i*3+2] = c.b + (Math.random()-0.5)*0.1;
  }
  return { positions, colors };
}

// Flower shape: rose curve + center
function generateFlower(count) {
  const positions = new Float32Array(count * 3);
  const colors = new Float32Array(count * 3);
  const petalCount = 6;
  const centerRatio = 0.15;
  for (let i = 0; i < count; i++) {
    let x, y, z;
    if (Math.random() < centerRatio) {
      // Flower center
      const a = Math.random() * Math.PI * 2;
      const r = Math.random() * 2;
      x = Math.cos(a) * r;
      y = Math.sin(a) * r;
      z = (Math.random() - 0.5) * 1.5;
    } else {
      // Petals
      const petal = Math.floor(Math.random() * petalCount);
      const angle = (petal / petalCount) * Math.PI * 2;
      const t = (Math.random() - 0.5) * 1.2;
      const petalLen = 6 + Math.random() * 4;
      const petalWidth = 2.5 + Math.random() * 1.5;
      const px = t * petalWidth;
      const py = Math.abs(t) < 0.6 ? petalLen * (1 - t*t*1.5) * (0.6 + Math.random()*0.4) : 0;
      if (py <= 0) { i--; continue; }
      x = Math.cos(angle) * py - Math.sin(angle) * px;
      y = Math.sin(angle) * py + Math.cos(angle) * px;
      z = (Math.random() - 0.5) * 2;
    }
    positions[i*3] = x * 0.25;
    positions[i*3+1] = y * 0.25;
    positions[i*3+2] = z;
    const c = STATE.color;
    colors[i*3] = c.r + (Math.random()-0.5)*0.1;
    colors[i*3+1] = c.g + (Math.random()-0.5)*0.1;
    colors[i*3+2] = c.b + (Math.random()-0.5)*0.1;
  }
  return { positions, colors };
}

// Firework: sphere bursts with trails
function generateFirework(count) {
  const positions = new Float32Array(count * 3);
  const colors = new Float32Array(count * 3);
  const burstCount = 5;
  for (let i = 0; i < count; i++) {
    const burst = Math.floor(Math.random() * burstCount);
    const burstAngle = (burst / burstCount) * Math.PI * 2;
    const burstR = 3 + burst * 1.5;
    const burstX = Math.cos(burstAngle) * burstR;
    const burstY = Math.sin(burstAngle) * burstR + 2;
    // Spherical distribution from burst center
    const theta = Math.random() * Math.PI * 2;
    const phi = Math.acos(2 * Math.random() - 1);
    const r = Math.pow(Math.random(), 0.5) * 5;
    const sx = r * Math.sin(phi) * Math.cos(theta);
    const sy = r * Math.sin(phi) * Math.sin(theta);
    const sz = r * Math.cos(phi);
    positions[i*3] = (burstX + sx) * 0.25;
    positions[i*3+1] = (burstY + sy) * 0.25;
    positions[i*3+2] = sz * 0.25;
    // Gradient color from center
    const dist = r / 5;
    const c = STATE.color;
    colors[i*3] = c.r * (1 - dist*0.3) + (Math.random()-0.5)*0.15;
    colors[i*3+1] = c.g * (1 - dist*0.3) + (Math.random()-0.5)*0.15;
    colors[i*3+2] = c.b * (1 - dist*0.3) + (Math.random()-0.5)*0.15;
  }
  return { positions, colors };
}

function generateModel(model, count) {
  switch (model) {
    case 'heart': return generateHeart(count);
    case 'flower': return generateFlower(count);
    case 'firework': return generateFirework(count);
    default: return generateHeart(count);
  }
}

function initParticles() {
  if (points) {
    scene.remove(points);
    geometry.dispose();
    material.dispose();
  }
  const count = STATE.particleCount;
  const { positions, colors } = generateModel(STATE.model, count);
  basePositions = new Float32Array(positions);
  targetPositions = new Float32Array(positions);

  geometry = new THREE.BufferGeometry();
  geometry.setAttribute('position', new THREE.BufferAttribute(new Float32Array(positions), 3));
  geometry.setAttribute('color', new THREE.BufferAttribute(new Float32Array(colors), 3));

  // Add random sizes for variation
  const sizes = new Float32Array(count);
  for (let i = 0; i < count; i++) {
    sizes[i] = 0.5 + Math.random() * 1.0;
  }
  geometry.setAttribute('aSize', new THREE.BufferAttribute(sizes, 1));

  material = new THREE.ShaderMaterial({
    uniforms: {
      uTime: { value: 0 },
      uBaseSize: { value: STATE.particleSize * renderer.getPixelRatio() },
      uColor: { value: STATE.color },
      uScale: { value: 1.0 },
    },
    vertexShader: `
      attribute float aSize;
      varying vec3 vColor;
      varying float vAlpha;
      uniform float uTime;
      uniform float uBaseSize;
      uniform float uScale;

      void main() {
        vColor = color;
        vec3 pos = position;
        // Subtle floating animation
        pos.x += sin(uTime * 0.5 + position.y * 2.0) * 0.08;
        pos.y += cos(uTime * 0.4 + position.x * 2.0) * 0.08;
        pos.z += sin(uTime * 0.3 + position.z * 2.0) * 0.05;

        vec4 mvPosition = modelViewMatrix * vec4(pos, 1.0);
        float dist = length(mvPosition.xyz);
        gl_PointSize = uBaseSize * aSize * uScale * (15.0 / max(dist, 1.0));
        gl_Position = projectionMatrix * mvPosition;

        // Fade based on distance
        vAlpha = smoothstep(50.0, 5.0, dist) * (0.7 + 0.3 * aSize);
      }
    `,
    fragmentShader: `
      varying vec3 vColor;
      varying float vAlpha;

      void main() {
        float d = length(gl_PointCoord - vec2(0.5));
        if (d > 0.5) discard;
        // Soft glow
        float alpha = smoothstep(0.5, 0.1, d) * vAlpha;
        gl_FragColor = vec4(vColor, alpha);
      }
    `,
    transparent: true,
    depthWrite: false,
    blending: THREE.AdditiveBlending,
    vertexColors: true,
  });

  points = new THREE.Points(geometry, material);
  scene.add(points);
}

initParticles();

// ============================================================
//  Update particles based on gesture
// ============================================================
function updateParticlesFromGesture() {
  if (!geometry) return;
  const posAttr = geometry.getAttribute('position');
  const colAttr = geometry.getAttribute('color');
  const count = posAttr.count;

  // Smooth interpolation
  STATE.scale += (STATE.targetScale - STATE.scale) * 0.08;
  STATE.diffusion += (STATE.targetDiffusion - STATE.diffusion) * 0.08;

  for (let i = 0; i < count; i++) {
    const bx = basePositions[i*3];
    const by = basePositions[i*3+1];
    const bz = basePositions[i*3+2];

    // Scale
    let x = bx * STATE.scale;
    let y = by * STATE.scale;
    let z = bz * STATE.scale;

    // Diffusion: push particles outward
    const len = Math.sqrt(bx*bx + by*by + bz*bz) || 0.01;
    const diffusionFactor = 1 + STATE.diffusion * 2;
    x = (bx / len) * len * diffusionFactor * STATE.scale + (Math.random()-0.5) * STATE.diffusion * 0.5;
    y = (by / len) * len * diffusionFactor * STATE.scale + (Math.random()-0.5) * STATE.diffusion * 0.5;
    z = (bz / len) * len * diffusionFactor * STATE.scale + (Math.random()-0.5) * STATE.diffusion * 0.3;

    posAttr.array[i*3] = x;
    posAttr.array[i*3+1] = y;
    posAttr.array[i*3+2] = z;
  }
  posAttr.needsUpdate = true;
}

// ============================================================
//  MediaPipe Hands Setup
// ============================================================
let hands = null;
let mpCamera = null;
const videoElement = document.getElementById('camera-video');
const overlayCanvas = document.getElementById('camera-overlay');
const overlayCtx = overlayCanvas.getContext('2d');

function initHands() {
  if (hands) return;
  hands = new Hands({
    locateFile: (file) => `https://cdn.jsdelivr.net/npm/@mediapipe/hands@0.4.1675469240/${file}`
  });
  hands.setOptions({
    maxNumHands: 1,
    modelComplexity: 1,
    minDetectionConfidence: 0.7,
    minTrackingConfidence: 0.5,
  });
  hands.onResults(onHandResults);
}

function onHandResults(results) {
  overlayCanvas.width = overlayCanvas.clientWidth;
  overlayCanvas.height = overlayCanvas.clientHeight;
  overlayCtx.clearRect(0, 0, overlayCanvas.width, overlayCanvas.height);

  if (results.multiHandLandmarks && results.multiHandLandmarks.length > 0) {
    const landmarks = results.multiHandLandmarks[0];
    STATE.handDetected = true;

    // Draw hand skeleton
    drawConnectors(overlayCtx, landmarks, HAND_CONNECTIONS, { color: 'rgba(120,90,255,0.6)', lineWidth: 2 });
    drawLandmarks(overlayCtx, landmarks, { color: '#785aff', lineWidth: 1, radius: 3 });

    // Thumb tip (4) and index finger tip (8)
    const thumb = landmarks[4];
    const index = landmarks[8];
    const middle = landmarks[12];
    const ring = landmarks[16];
    const pinky = landmarks[20];
    const wrist = landmarks[0];
    const palmCenter = landmarks[9]; // middle finger MCP

    // Pinch distance (thumb to index)
    const pinchDist = Math.sqrt(
      (thumb.x - index.x)**2 +
      (thumb.y - index.y)**2 +
      (thumb.z - index.z)**2
    );

    // Palm openness: average distance of fingertips to palm center
    const fingertips = [thumb, index, middle, ring, pinky];
    let avgDist = 0;
    for (const tip of fingertips) {
      avgDist += Math.sqrt(
        (tip.x - palmCenter.x)**2 +
        (tip.y - palmCenter.y)**2
      );
    }
    avgDist /= 5;

    // Map pinch to scale (closer = smaller, farther = bigger)
    const targetScale = THREE.MathUtils.clamp(THREE.MathUtils.mapLinear(pinchDist, 0.02, 0.25, 0.3, 2.5), 0.3, 2.5);
    STATE.targetScale = targetScale;

    // Map palm openness to diffusion
    const targetDiffusion = THREE.MathUtils.clamp(THREE.MathUtils.mapLinear(avgDist, 0.05, 0.18, 0, 1.5), 0, 1.5);
    STATE.targetDiffusion = targetDiffusion;

    // Update UI
    document.getElementById('gesture-dot').className = 'gesture-dot active';
    document.getElementById('gesture-text').textContent = '手势检测中';
    document.getElementById('gesture-values').textContent =
      `缩放: ${STATE.targetScale.toFixed(2)}  扩散: ${STATE.targetDiffusion.toFixed(2)}`;
  } else {
    STATE.handDetected = false;
    STATE.targetScale = 1.0;
    STATE.targetDiffusion = 0.0;
    document.getElementById('gesture-dot').className = 'gesture-dot inactive';
    document.getElementById('gesture-text').textContent = '未检测到手部';
    document.getElementById('gesture-values').textContent = '';
  }
}

async function startCamera() {
  try {
    initHands();
    const stream = await navigator.mediaDevices.getUserMedia({ video: { width: 640, height: 480, facingMode: 'user' } });
    videoElement.srcObject = stream;
    STATE.cameraActive = true;
    document.getElementById('camera-container').style.display = 'block';
    document.getElementById('camera-toggle').classList.add('active');

    mpCamera = new Camera(videoElement, {
      onFrame: async () => {
        await hands.send({ image: videoElement });
      },
      width: 640,
      height: 480,
    });
    mpCamera.start();
  } catch (err) {
    console.error('Camera error:', err);
    alert('无法访问摄像头，请检查权限设置');
  }
}

function stopCamera() {
  if (mpCamera) { mpCamera.stop(); mpCamera = null; }
  if (videoElement.srcObject) {
    videoElement.srcObject.getTracks().forEach(t => t.stop());
    videoElement.srcObject = null;
  }
  STATE.cameraActive = false;
  STATE.handDetected = false;
  STATE.targetScale = 1.0;
  STATE.targetDiffusion = 0.0;
  document.getElementById('camera-container').style.display = 'none';
  document.getElementById('camera-toggle').classList.remove('active');
  document.getElementById('gesture-dot').className = 'gesture-dot inactive';
  document.getElementById('gesture-text').textContent = '手势检测未开启';
  document.getElementById('gesture-values').textContent = '';
}

// ============================================================
//  UI Event Handlers
// ============================================================

// Panel toggle
document.getElementById('panel-header').addEventListener('click', () => {
  document.getElementById('panel').classList.toggle('collapsed');
});

// Model buttons
document.querySelectorAll('.model-btn').forEach(btn => {
  btn.addEventListener('click', () => {
    document.querySelectorAll('.model-btn').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    STATE.model = btn.dataset.model;
    initParticles();
  });
});

// Color presets
document.querySelectorAll('.color-dot').forEach(dot => {
  dot.addEventListener('click', () => {
    document.querySelectorAll('.color-dot').forEach(d => d.classList.remove('active'));
    dot.classList.add('active');
    const hex = dot.dataset.color;
    STATE.color.set(hex);
    document.getElementById('color-picker').value = hex;
    updateParticleColors();
  });
});

// Color picker
document.getElementById('color-picker').addEventListener('input', (e) => {
  STATE.color.set(e.target.value);
  document.querySelectorAll('.color-dot').forEach(d => d.classList.remove('active'));
  updateParticleColors();
});

function updateParticleColors() {
  if (!geometry) return;
  const colAttr = geometry.getAttribute('color');
  for (let i = 0; i < colAttr.count; i++) {
    colAttr.array[i*3] = STATE.color.r + (Math.random()-0.5)*0.1;
    colAttr.array[i*3+1] = STATE.color.g + (Math.random()-0.5)*0.1;
    colAttr.array[i*3+2] = STATE.color.b + (Math.random()-0.5)*0.1;
  }
  colAttr.needsUpdate = true;
  if (material) material.uniforms.uColor.value.copy(STATE.color);
}

// Sliders
document.getElementById('particle-size').addEventListener('input', (e) => {
  STATE.particleSize = parseFloat(e.target.value);
  document.getElementById('size-val').textContent = STATE.particleSize.toFixed(1);
  if (material) material.uniforms.uBaseSize.value = STATE.particleSize * renderer.getPixelRatio();
});

document.getElementById('particle-density').addEventListener('input', (e) => {
  STATE.particleCount = parseInt(e.target.value);
  document.getElementById('density-val').textContent = STATE.particleCount;
  initParticles();
});

document.getElementById('rotate-speed').addEventListener('input', (e) => {
  STATE.rotateSpeed = parseFloat(e.target.value);
  document.getElementById('rotate-val').textContent = STATE.rotateSpeed.toFixed(2);
});

// Camera toggle
document.getElementById('camera-toggle').addEventListener('click', () => {
  if (STATE.cameraActive) stopCamera();
  else startCamera();
});

// Fullscreen
document.getElementById('fullscreen-btn').addEventListener('click', () => {
  if (!document.fullscreenElement) {
    document.documentElement.requestFullscreen().catch(()=>{});
  } else {
    document.exitFullscreen().catch(()=>{});
  }
});

// Window resize
window.addEventListener('resize', () => {
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
});

// ============================================================
//  Animation Loop
// ============================================================
function animate() {
  requestAnimationFrame(animate);
  STATE.time += 0.016;

  // Rotate particles
  if (points) {
    points.rotation.y += STATE.rotateSpeed * 0.01;
    points.rotation.x = Math.sin(STATE.time * 0.1) * 0.1;
    material.uniforms.uTime.value = STATE.time;
    material.uniforms.uScale.value = STATE.scale;
  }

  updateParticlesFromGesture();
  renderer.render(scene, camera);
}

// ============================================================
//  Init
// ============================================================
window.addEventListener('load', () => {
  setTimeout(() => {
    document.getElementById('loading').classList.add('hide');
  }, 800);
  animate();
});
</script>
</body>
</html>
